<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Outer barrel of the log -->
  <path d="M12,16 L48,16 C54,16 54,48 48,48 L12,48 C6,48 6,16 12,16 Z" fill="url(#logGrad)" stroke="#3e1e07" stroke-width="2.5"/>
  <!-- Left circular cut wood face -->
  <ellipse cx="12" cy="32" rx="6" ry="16" fill="#e5c185" stroke="#3e1e07" stroke-width="2"/>
  <!-- Tree rings on the face -->
  <ellipse cx="12" cy="32" rx="3.5" ry="9" fill="none" stroke="#a0662d" stroke-width="1.5"/>
  <ellipse cx="12" cy="32" rx="1" ry="3" fill="none" stroke="#a0662d" stroke-width="1.5"/>
  <!-- Wood texture streaks on the barrel -->
  <path d="M22,24 L42,24" stroke="rgba(60,30,5,0.25)" stroke-width="2" stroke-linecap="round"/>
  <path d="M26,32 L46,32" stroke="rgba(60,30,5,0.25)" stroke-width="2" stroke-linecap="round"/>
  <path d="M18,40 L38,40" stroke="rgba(60,30,5,0.25)" stroke-width="2" stroke-linecap="round"/>
  
  <defs>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="50%" stop-color="#a0522d"/>
      <stop offset="100%" stop-color="#5c2c0e"/>
    </linearGradient>
  </defs>
</svg>
